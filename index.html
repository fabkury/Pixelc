<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Pixelc</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon180.png">
    <link rel="shortcut icon" href="icon196.png" sizes="196x196">

</head>

<style>

    /* The emscripten opengl canvas */
    #canvas {
        position: absolute;
        top: 0px;
        left: 0px;
        margin: 0px;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: block;
        border: 0px none;
        background-color: black;
    }

    /* The startup texts... (like downloading) font size according to viewport size */
    .startup_text {
        display: none; /* Hidden by default */
        position: fixed; /* Stay in place */
        z-index: 1; /* Sit on top */
        left: 0;
        top: 0;
        font-size: 4vmin;
        color: lightgray;
        overflow: hidden;
    }

    /* input is wrapped in modal_button label */
    input[type="file"] { display: none; }
    
    /* The background of modal windows */
    .modal {
        display: none; /* Hidden by default */
        position: fixed; /* Stay in place */
        z-index: 1; /* Sit on top */
        left: 0;
        top: 0;
        width: 100%; /* Full width */
        height: 100%; /* Full height */
        overflow: hidden;
        background-color: rgb(0, 0, 0); /* Fallback color */
        background-color: rgba(0, 0, 0, 0.4); /* Black w/ opacity */
    }

    /* Modal content/box */
    .modal_content {
        background-color: #fefefe;
        margin-top: 15%;
        margin-left: auto;
        margin-right: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%; /* Could be more or less, depending on screen size */
    }

    /* Set the used font size according to the viewport size */
    .modal_font {
        font-size: 4vmin;
    }
        
    /* Set the used font size according to the viewport size */
    .modal_font_small {
        font-size: 3vmin;
    }
    
    /* wraps input file */
    .modal_button { 
        font-size: 4vmin;
        border: 2vmin solid #ccc;
        display: inline-block;
        padding: 3vmin 6vmin;
        cursor: pointer;
    }

    /* The modal window close button (also font size according to the viewport size) */
    .modal_content_close {
        color: #aaa;
        float: right;
        font-size: 6vmin;
        font-weight: bold;
    }

    .modal_content_close:hover,
    .modal_content_close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    }


</style>

<body>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <div id="modal_window_file" class="modal">
        <div class="modal_content">
            <span class="modal_content_close">&times;</span>
            <p class="modal_font">File Upload</p>
            <label id="modal_upload_button" class="modal_button">
                <input id="file_uploader" type="file"/>
                Upload file
            </label>
            <label id="modal_upload_png_button" class="modal_button">
                 <input id="file_uploader_png" type="file" accept="image/png"/>
                 Upload .png file
            </label>
            <label id="modal_upload_txt_button" class="modal_button">
                <input id="file_uploader_txt" type="file" accept="text/plain"/>
                Upload .txt file
            </label>
            <label id="modal_upload_json_button" class="modal_button">
                <input id="file_uploader_json" type="file" accept="application/json"/>
                Upload .json file
            </label>
            <label id="modal_upload_webp_button" class="modal_button">
                <input id="file_uploader_webp" type="file" accept="image/webp"/>
                Upload .webp file
            </label>
            <label id="modal_upload_image_button" class="modal_button">
                <input id="file_uploader_image" type="file" accept="image/png,image/webp,image/gif"/>
                Upload image
            </label>

            <p class="modal_font_small">(Please don't zoom in)</p>
        </div>
    </div>

    <p class="startup_text"></p>


<script type='text/javascript'>

    // called from the engine on error
    // startup checks
    function set_exit_failure_error_msg() {
        var newContent = '<!DOCTYPE html><html><body style="background-color:black;"><h1 style="color:white;">Potato Browsers are not supported!</h1><p style="color:silver;">Full WebGL2.0 is needed!</p></body></html>';
        document.open();
        document.write(newContent);
        document.close();
    }
    
    // called from s_assume
    function set_assume(text) {
        var newContent = '<!DOCTYPE html><html><body style="background-color:black;"><h1 style="color:white;">' + text + '</h1></body></html>';
        document.open();
        document.write(newContent);
        document.close();
    }

    // called from the engine to offer a download file
    function offer_file_as_download(filename) {
        try {
            var mime = "application/octet-stream";

            filename_lower = filename.toLowerCase();
            if (filename_lower.endsWith(".png"))
                mime = "image/png";
            else if (filename_lower.endsWith(".webp"))
                mime = "image/webp";
            else if (filename_lower.endsWith(".gif"))
                mime = "image/gif";
            else if (filename_lower.endsWith(".txt"))
                mime = "text/plain";
            else if (filename_lower.endsWith(".json"))
                mime = "application/json";

            let content = Module.FS.readFile(filename);
            console.log(`Offering download of "${filename}", with ${content.length} bytes...`);

            var a = document.createElement('a');
            a.download = filename;
            a.href = URL.createObjectURL(new Blob([content], {type: mime}));
            a.style.display = 'none';

            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            }, 2000);
        } catch (e) {
            console.log('offering file download failed for file: ', filename);
        }
    }

    // Makapix Club integration via postMessage (iframe communication)
    var MAKAPIX_ORIGINS = ['https://makapix.club', 'https://development.makapix.club'];
    function isAllowedOrigin(origin) { return MAKAPIX_ORIGINS.includes(origin); }
    var makapixInitialized = false;
    var detectedParentOrigin = null;
    var emscriptenRuntimeReady = false;
    var pixelcCanvasReady = false; // True when C code signals canvas is ready
    var pendingImport = null; // Stores {webpPtr, dataSize} if import arrives before canvas ready

    // Called from C code (main.c init()) when canvas is fully initialized
    window.onPixelcCanvasReady = function() {
        console.log('Pixelc canvas ready signal received from C code');
        pixelcCanvasReady = true;

        // Process any pending import
        if (pendingImport) {
            console.log('Processing pending import now that canvas is ready');
            doImport(pendingImport.webpPtr, pendingImport.dataSize);
            pendingImport = null;
        }
    };

    // Actually perform the import (called when canvas is ready)
    function doImport(webpPtr, dataSize) {
        console.log('MAKAPIX_EDIT_WEBP: calling pixelc_load_webp_data (' + dataSize + ' bytes)...');

        try {
            Module.ccall('pixelc_load_webp_data', null,
                ['number', 'number'],
                [webpPtr, dataSize]);
        } catch (e) {
            console.error('MAKAPIX_EDIT_WEBP: ccall failed:', e);
        }

        // Free allocated memory
        Module._free(webpPtr);

        console.log('MAKAPIX_EDIT_WEBP: import complete');
    }

    // Function to process MAKAPIX_EDIT_WEBP data
    // Receives raw WebP bytes and uses the same code path as Import dialog
    function processEditWebP(data) {
        console.log('Processing MAKAPIX_EDIT_WEBP: raw WebP data, ' + data.webpDataSize + ' bytes');

        var webpData = data.webpData;  // ArrayBuffer with raw WebP file bytes

        if (!webpData || webpData.byteLength === 0) {
            console.error('MAKAPIX_EDIT_WEBP: invalid or empty WebP data');
            return;
        }

        var dataSize = webpData.byteLength;
        console.log('MAKAPIX_EDIT_WEBP: WebP data size = ' + dataSize + ' bytes');

        // Log first bytes to verify it's a valid WebP (should start with "RIFF")
        var firstBytes = new Uint8Array(webpData, 0, Math.min(12, dataSize));
        var header = String.fromCharCode.apply(null, firstBytes.slice(0, 4));
        console.log('MAKAPIX_EDIT_WEBP: file header = "' + header + '" (expecting "RIFF")');

        if (header !== 'RIFF') {
            console.error('MAKAPIX_EDIT_WEBP: not a valid WebP file');
            return;
        }

        // Allocate Emscripten heap memory for WebP data
        var webpPtr = Module._malloc(dataSize);
        if (!webpPtr) {
            console.error('MAKAPIX_EDIT_WEBP: failed to allocate memory');
            return;
        }

        // Copy WebP data to Emscripten heap
        var heapView = new Uint8Array(Module.HEAPU8.buffer, webpPtr, dataSize);
        heapView.set(new Uint8Array(webpData));

        // If canvas is ready, import immediately; otherwise queue it
        if (pixelcCanvasReady) {
            console.log('MAKAPIX_EDIT_WEBP: canvas ready, importing immediately');
            doImport(webpPtr, dataSize);
        } else {
            console.log('MAKAPIX_EDIT_WEBP: canvas not ready yet, queuing import');
            pendingImport = { webpPtr: webpPtr, dataSize: dataSize };
        }
    }

    // Listen for init message from parent (Makapix)
    window.addEventListener('message', function(event) {
        if (!isAllowedOrigin(event.origin)) return;

        var data = event.data;
        if (!data || !data.type) return;

        if (data.type === 'MAKAPIX_INIT') {
            console.log('Makapix init received from: ' + event.origin);
            makapixInitialized = true;
            detectedParentOrigin = event.origin;
            // Could store access token if needed for future features
        }

        // Handle animated WebP import from Makapix (raw WebP bytes)
        if (data.type === 'MAKAPIX_EDIT_WEBP') {
            console.log('Makapix edit WebP received: ' + (data.webpDataSize || (data.webpData && data.webpData.byteLength)) + ' bytes');

            if (!makapixInitialized) {
                console.error('MAKAPIX_EDIT_WEBP received before MAKAPIX_INIT');
                return;
            }

            // processEditWebP handles queuing if canvas isn't ready yet
            processEditWebP(data);
        }
    });

    // Signal to parent that Pixelc is ready - called when Emscripten runtime is initialized
    function signalPixelcReady() {
        if (window.parent !== window && detectedParentOrigin) {
            // Send ready signal only to the detected parent origin
            console.log('Sending PIXELC_READY to: ' + detectedParentOrigin);
            window.parent.postMessage({ type: 'PIXELC_READY' }, detectedParentOrigin);
        } else if (window.parent !== window) {
            // Send ready signal to all allowed origins (we don't know which one yet)
            console.log('Sending PIXELC_READY to all allowed origins');
            MAKAPIX_ORIGINS.forEach(function(origin) {
                try {
                    window.parent.postMessage({ type: 'PIXELC_READY' }, origin);
                } catch (e) {
                    // Ignore origin mismatch errors
                }
            });
        }
    }

    // Called from the engine to export artwork to Makapix Club
    function export_to_makapix(filename, width, height, frameCount) {
        try {
            let content = Module.FS.readFile(filename);
            console.log('Exporting to Makapix: "' + filename + '", ' + width + 'x' + height + ', ' + frameCount + ' frames, ' + content.length + ' bytes');

            // Detect mime type from filename
            let mime = 'image/png';
            if (filename.toLowerCase().endsWith('.gif')) {
                mime = 'image/gif';
            } else if (filename.toLowerCase().endsWith('.webp')) {
                mime = 'image/webp';
            }

            // Convert to blob for postMessage
            let blob = new Blob([content], {type: mime});

            // Send export message to parent window
            if (window.parent !== window && detectedParentOrigin) {
                window.parent.postMessage({
                    type: 'PIXELC_EXPORT',
                    blob: blob,
                    name: 'pixelc_artwork',
                    width: width,
                    height: height,
                    frameCount: frameCount
                }, detectedParentOrigin);
            } else {
                // Fallback: offer as download if not in iframe
                offer_file_as_download(filename);
            }
        } catch (e) {
            console.error('Export to Makapix failed:', e);
            alert('Export failed: ' + e.message);
        }
    }

    //
    // local file upload stuff, see ask_for_file_upload below
    //
    var file_upload_filename = 'none.txt'
    var file_upload_is_ascii = false;

    function handle_file_upload(evt) {
        console.log('got a file event upload for: ' + file_upload_filename + ' is_ascii: ' + file_upload_is_ascii);
        try {
            var files = evt.target.files; // FileList object

            console.log('file upload name: ' + files[0].name);

            var fr = new FileReader();
            fr.onload = function () {
                var data = fr.result;
                var stream = FS.open(file_upload_filename, 'w');
                var data_bytes = new Uint8Array(data);
                FS.write(stream, data_bytes, 0, data_bytes.length, 0);
                FS.close(stream);

                // close the modal window
                modal_file = document.getElementById("modal_window_file");
                modal_file.style.display = "none";

                // call done
                ccall('e_io_file_upload_done', 'v', ['string', 'boolean', 'string'],
                    [file_upload_filename, file_upload_is_ascii, files[0].name],
                    {async: true});
            };
            fr.readAsArrayBuffer(files[0]);
        } catch (e) {
            console.log('file event failed for upload for: ' + file_upload_filename + ' is_ascii: ' + file_upload_is_ascii);
        }
    }

    // Unified image upload handler - auto-detects PNG vs WEBP via magic bytes
    function handle_image_file_upload(evt) {
        console.log('got an image file upload event');
        try {
            var files = evt.target.files;
            if (!files || files.length === 0) return;

            console.log('image upload name: ' + files[0].name);

            var fr = new FileReader();
            fr.onload = function () {
                var data = fr.result;
                var data_bytes = new Uint8Array(data);

                // Detect file type via magic bytes
                // PNG: 89 50 4E 47 (0x89 'P' 'N' 'G')
                // WEBP: 52 49 46 46 ... 57 45 42 50 ('RIFF' ... 'WEBP')
                // GIF: 47 49 46 38 39/37 61 ('GIF89a' or 'GIF87a')
                var isPng = (data_bytes.length >= 4 &&
                             data_bytes[0] === 0x89 &&
                             data_bytes[1] === 0x50 &&
                             data_bytes[2] === 0x4E &&
                             data_bytes[3] === 0x47);

                var isWebp = (data_bytes.length >= 12 &&
                              data_bytes[0] === 0x52 &&  // R
                              data_bytes[1] === 0x49 &&  // I
                              data_bytes[2] === 0x46 &&  // F
                              data_bytes[3] === 0x46 &&  // F
                              data_bytes[8] === 0x57 &&  // W
                              data_bytes[9] === 0x45 &&  // E
                              data_bytes[10] === 0x42 && // B
                              data_bytes[11] === 0x50);  // P

                var isGif = (data_bytes.length >= 6 &&
                             data_bytes[0] === 0x47 &&  // G
                             data_bytes[1] === 0x49 &&  // I
                             data_bytes[2] === 0x46 &&  // F
                             data_bytes[3] === 0x38 &&  // 8
                             (data_bytes[4] === 0x39 || data_bytes[4] === 0x37) &&  // 9 or 7
                             data_bytes[5] === 0x61);   // a

                var actual_filename;
                if (isGif) {
                    actual_filename = 'import.gif';
                    console.log('Detected GIF file');
                } else if (isPng) {
                    actual_filename = 'import.png';
                    console.log('Detected PNG file');
                } else if (isWebp) {
                    actual_filename = 'import.webp';
                    console.log('Detected WEBP file');
                } else {
                    console.log('Unknown image format, treating as PNG');
                    actual_filename = 'import.png';
                }

                // Delete the other import files to avoid stale data
                try {
                    if (actual_filename !== 'import.png') {
                        FS.unlink('import.png');
                    }
                } catch (e) { /* File didn't exist, that's fine */ }
                try {
                    if (actual_filename !== 'import.webp') {
                        FS.unlink('import.webp');
                    }
                } catch (e) { /* File didn't exist, that's fine */ }
                try {
                    if (actual_filename !== 'import.gif') {
                        FS.unlink('import.gif');
                    }
                } catch (e) { /* File didn't exist, that's fine */ }

                // Save to the detected filename
                var stream = FS.open(actual_filename, 'w');
                FS.write(stream, data_bytes, 0, data_bytes.length, 0);
                FS.close(stream);

                // close the modal window
                modal_file = document.getElementById("modal_window_file");
                modal_file.style.display = "none";

                // Call done with the REGISTERED filename (file_upload_filename) so the
                // callback lookup succeeds. The C code will check which file exists.
                ccall('e_io_file_upload_done', 'v', ['string', 'boolean', 'string'],
                    [file_upload_filename, false, files[0].name],
                    {async: true});
            };
            fr.readAsArrayBuffer(files[0]);
        } catch (e) {
            console.log('image file upload failed: ' + e);
        }
    }

    file_uploader = document.getElementById('file_uploader');
    file_uploader_png = document.getElementById('file_uploader_png');
    file_uploader_txt = document.getElementById('file_uploader_txt');
    file_uploader_json = document.getElementById('file_uploader_json');
    file_uploader_webp = document.getElementById('file_uploader_webp');
    file_uploader_image = document.getElementById('file_uploader_image');

    file_uploader.addEventListener('change', handle_file_upload, false);
    file_uploader_png.addEventListener('change', handle_file_upload, false);
    file_uploader_txt.addEventListener('change', handle_file_upload, false);
    file_uploader_json.addEventListener('change', handle_file_upload, false);
    file_uploader_webp.addEventListener('change', handle_file_upload, false);
    file_uploader_image.addEventListener('change', handle_image_file_upload, false);

    // called from the engine to ask for a file upload
    function ask_for_file_upload(filename, as_ascii) {
        // Check for the various File API support.
        if (!(window.File && window.FileReader && window.FileList && window.Blob)) {
            alert('The File APIs are not fully supported in this browser.');
            return;
        }

        console.log(`Ask for file upload for "${filename}"`);

        file_upload_filename = filename;
        file_upload_is_ascii = as_ascii;


        uploader_btn = document.getElementById('modal_upload_button');
        uploader_png_btn = document.getElementById('modal_upload_png_button');
        uploader_txt_btn = document.getElementById('modal_upload_txt_button');
        uploader_json_btn = document.getElementById('modal_upload_json_button');
        uploader_webp_btn = document.getElementById('modal_upload_webp_button');
        uploader_image_btn = document.getElementById('modal_upload_image_button');

        uploader_btn.style.display = "none";
        uploader_png_btn.style.display = "none";
        uploader_txt_btn.style.display = "none";
        uploader_json_btn.style.display = "none";
        uploader_webp_btn.style.display = "none";
        uploader_image_btn.style.display = "none";

        filename_lower = filename.toLowerCase();
        if (filename_lower.endsWith(".png"))
            uploader_png_btn.style.display = "block";
        else if (filename_lower.endsWith(".webp"))
            uploader_webp_btn.style.display = "block";
        else if (filename_lower.endsWith(".txt"))
            uploader_txt_btn.style.display = "block";
        else if (filename_lower.endsWith(".json"))
            uploader_json_btn.style.display = "block";
        else if (filename_lower === "import.image")
            uploader_image_btn.style.display = "block";
        else
            uploader_btn.style.display = "block";

        // open modal box
        modal_file = document.getElementById("modal_window_file");
        modal_file.style.display = "block";
    }

    // Get the all file modal windows and its close buttons
    var modal_file = document.getElementById("modal_window_file");
    var modal_file_close = document.getElementsByClassName("modal_content_close")[0];

    // When the user clicks on <span> (x), close the modal
    modal_file_close.onclick = function () {
        modal_file.style.display = "none";
    }

    // emscripten module
    var Module = {
        canvas: (function () {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function (e) {
                alert('WebGL context lost. You will need to reload the page.');
                e.preventDefault();
            }, false);

            return canvas;
        })(),
        setStatus: function(text) {
            console.log("Module::setStatus: "+ text);
            var startup_text = document.getElementsByClassName("startup_text")[0];
            if(!startup_text) return; // Element may not exist if page was replaced
            if(!text) {
                startup_text.style.display = "none";
                // Note: Canvas ready signal comes from C code via window.onPixelcCanvasReady()
            } else {
                startup_text.style.display = "block";
                startup_text.innerHTML = text;
            }
        },
        onRuntimeInitialized: function() {
            console.log('Emscripten runtime initialized');
            emscriptenRuntimeReady = true;

            // Signal to parent that Pixelc is ready
            signalPixelcReady();

            // Note: pendingEditWebP will be processed when setStatus receives empty text
            // (indicating full app initialization including renderer)
        },
    };
    window.onerror = function (event) {
        // Only show error page if runtime hasn't initialized yet
        if (!emscriptenRuntimeReady) {
            set_exit_failure_error_msg();
        }
    };


</script>
<script async type="text/javascript" src="index.js"></script>
</body>
</html>
